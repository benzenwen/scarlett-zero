# Generates ScarlettMixControl.xcodeproj:  cd macOS && xcodegen
name: ScarlettMixControl
options:
  bundleIdPrefix: com.benwen
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"

targets:
  ScarlettMixControl:
    type: application
    platform: macOS
    sources:
      - path: ScarlettMixControl
      - path: ../scarlett_core.c
        group: Transport
      - path: ../scarlett_core.h
        group: Transport
    settings:
      base:
        PRODUCT_NAME: Scarlett MixControl
        PRODUCT_BUNDLE_IDENTIFIER: com.benwen.ScarlettMixControl
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Scarlett MixControl
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright 2026 Ben Wen."
        SWIFT_OBJC_BRIDGING_HEADER: ScarlettMixControl/Hardware/ScarlettMixControl-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/..
        # IOKit device-level user clients need no entitlement outside the sandbox.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: -framework IOKit -framework CoreFoundation

  ScarlettMixControlTests:
    type: bundle.unit-test
    platform: macOS
    # Pure model code only — no host app, no device.
    sources:
      - path: ScarlettMixControlTests
      - path: ScarlettMixControl/Model
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.benwen.ScarlettMixControlTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"

schemes:
  ScarlettMixControl:
    build:
      targets:
        ScarlettMixControl: all
        ScarlettMixControlTests: [test]
    test:
      targets:
        - ScarlettMixControlTests
